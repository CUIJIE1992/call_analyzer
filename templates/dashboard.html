<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据统计 - 购房意向智能分析系统</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
    <!-- Mobile Sidebar Toggle -->
    <button class="sidebar-toggle" onclick="document.querySelector('.sidebar').classList.toggle('open')">
        <svg viewBox="0 0 24 24"><path d="M3 12h18M3 6h18M3 18h18" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="/" class="sidebar-brand">
                    <div class="sidebar-brand-icon">🏠</div>
                    <div class="sidebar-brand-text">
                        <span class="sidebar-brand-name">购房意向分析</span>
                        <span class="sidebar-brand-desc">AI Smart Analysis</span>
                    </div>
                </a>
            </div>
            <nav class="sidebar-nav">
                <a href="/" class="sidebar-nav-item">
                    <svg class="nav-icon-svg" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" stroke-linecap="round" stroke-linejoin="round"/><polyline points="9,22 9,12 15,12 15,22" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    <span>首页分析</span>
                </a>
                <a href="/history" class="sidebar-nav-item">
                    <svg class="nav-icon-svg" viewBox="0 0 24 24"><path d="M12 8v4l3 3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="10"/></svg>
                    <span>历史记录</span>
                </a>
                <a href="/dashboard" class="sidebar-nav-item active">
                    <svg class="nav-icon-svg" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
                    <span>数据统计</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <p class="sidebar-footer-text">AI驱动的房产销售洞察</p>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="main-header">
                <h1>数据统计仪表盘</h1>
                <p>分析数据概览与趋势洞察</p>
            </div>

            <div class="main-body">
                <div class="container">
                    <div class="dashboard-page">
                        <div class="dashboard-header">
                            <div class="date-filter">
                                <label for="startDate">开始日期：</label>
                                <input type="date" id="startDate" class="date-input">
                                <label for="endDate">结束日期：</label>
                                <input type="date" id="endDate" class="date-input">
                                <button class="btn btn-primary btn-small" id="applyFilter">
                                    <span>🔍</span> 筛选
                                </button>
                                <button class="btn btn-secondary btn-small" id="resetFilter">
                                    <span>🔄</span> 重置
                                </button>
                            </div>
                        </div>

                        <div class="stats-cards three-cards">
                            <div class="stat-card">
                                <div class="stat-icon">📈</div>
                                <div class="stat-content">
                                    <span class="stat-value" id="totalAnalysis">0</span>
                                    <span class="stat-label">总分析数</span>
                                </div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-icon">⭐</div>
                                <div class="stat-content">
                                    <span class="stat-value" id="avgScore">0</span>
                                    <span class="stat-label">平均意向分</span>
                                </div>
                            </div>
                            <div class="stat-card highlight">
                                <div class="stat-icon">🏆</div>
                                <div class="stat-content">
                                    <span class="stat-value" id="classACount">0</span>
                                    <span class="stat-label">A类客户数</span>
                                </div>
                            </div>
                        </div>

                        <div class="charts-grid">
                            <div class="chart-card">
                                <div class="chart-header">
                                    <h3>客户等级分布</h3>
                                </div>
                                <div class="chart-body">
                                    <canvas id="gradeChart"></canvas>
                                </div>
                            </div>

                            <div class="chart-card">
                                <div class="chart-header">
                                    <h3>分析数量分布</h3>
                                </div>
                                <div class="chart-body">
                                    <canvas id="trendChart"></canvas>
                                </div>
                            </div>

                            <div class="chart-card full-width">
                                <div class="chart-header">
                                    <h3>关注点排行</h3>
                                </div>
                                <div class="chart-body">
                                    <canvas id="concernsChart"></canvas>
                                </div>
                            </div>
                        </div>

                        <div class="dashboard-footer">
                            <p class="update-time">数据更新时间：<span id="updateTime">-</span></p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="loading-overlay" id="loadingOverlay" style="display: none;">
        <div class="loading-spinner"></div>
        <p>加载中...</p>
    </div>

    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
