<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>历史记录 - 购房意向智能分析系统</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- Mobile Sidebar Toggle -->
    <button class="sidebar-toggle" onclick="document.querySelector('.sidebar').classList.toggle('open')">
        <svg viewBox="0 0 24 24"><path d="M3 12h18M3 6h18M3 18h18" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="/" class="sidebar-brand">
                    <div class="sidebar-brand-icon">🏠</div>
                    <div class="sidebar-brand-text">
                        <span class="sidebar-brand-name">购房意向分析</span>
                        <span class="sidebar-brand-desc">AI Smart Analysis</span>
                    </div>
                </a>
            </div>
            <nav class="sidebar-nav">
                <a href="/" class="sidebar-nav-item">
                    <svg class="nav-icon-svg" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" stroke-linecap="round" stroke-linejoin="round"/><polyline points="9,22 9,12 15,12 15,22" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    <span>首页分析</span>
                </a>
                <a href="/history" class="sidebar-nav-item active">
                    <svg class="nav-icon-svg" viewBox="0 0 24 24"><path d="M12 8v4l3 3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="10"/></svg>
                    <span>历史记录</span>
                </a>
                <a href="/dashboard" class="sidebar-nav-item">
                    <svg class="nav-icon-svg" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
                    <span>数据统计</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <p class="sidebar-footer-text">AI驱动的房产销售洞察</p>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="main-header">
                <h1>分析历史记录</h1>
                <p>查看、筛选和管理所有通话分析记录</p>
            </div>

            <div class="main-body">
                <div class="container">
                    <section class="history-section">
                        <div class="filter-card">
                            <div class="filter-row">
                                <div class="filter-group">
                                    <label>关键词搜索</label>
                                    <input type="text" id="searchKeyword" placeholder="搜索文件名或标签...">
                                </div>
                                <div class="filter-group">
                                    <label>客户等级</label>
                                    <select id="filterRating">
                                        <option value="">全部等级</option>
                                        <option value="A">A级客户</option>
                                        <option value="B">B级客户</option>
                                        <option value="C">C级客户</option>
                                    </select>
                                </div>
                                <div class="filter-group">
                                    <label>意向强度</label>
                                    <select id="filterIntention">
                                        <option value="">全部意向</option>
                                        <option value="high">高意向</option>
                                        <option value="medium">中意向</option>
                                        <option value="low">低意向</option>
                                    </select>
                                </div>
                                <div class="filter-group">
                                    <label>开始日期</label>
                                    <input type="date" id="filterDateStart">
                                </div>
                                <div class="filter-group">
                                    <label>结束日期</label>
                                    <input type="date" id="filterDateEnd">
                                </div>
                            </div>
                            <div class="filter-actions">
                                <button class="btn btn-primary" id="searchBtn">
                                    <span>🔍</span> 搜索
                                </button>
                                <button class="btn btn-secondary" id="resetBtn">
                                    <span>🔄</span> 重置
                                </button>
                            </div>
                        </div>

                        <div class="table-wrapper">
                            <div class="table-header">
                                <div class="table-title">
                                    <span>📋</span>
                                    <span>分析记录列表</span>
                                    <span class="selected-count" id="selectedCount" style="display: none;">已选 0 条</span>
                                </div>
                                <div class="table-actions">
                                    <button class="btn btn-secondary" id="exportCsvBtn">
                                        <span>📥</span> 导出CSV
                                    </button>
                                    <button class="btn btn-secondary" id="compareBtn" disabled>
                                        <span>⚖️</span> 对比选中
                                    </button>
                                    <button class="btn btn-danger" id="batchDeleteBtn" disabled>
                                        <span>🗑️</span> 批量删除
                                    </button>
                                </div>
                            </div>

                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th class="checkbox-cell">
                                            <input type="checkbox" id="selectAll">
                                        </th>
                                        <th>时间</th>
                                        <th>文件名</th>
                                        <th>数据来源</th>
                                        <th>客户等级</th>
                                        <th>意向强度</th>
                                        <th>购房阶段</th>
                                        <th>标签</th>
                                    </tr>
                                </thead>
                                <tbody id="historyTableBody">
                                </tbody>
                            </table>

                            <div class="empty-state" id="emptyState" style="display: none;">
                                <div class="empty-state-icon">📭</div>
                                <h3>暂无历史记录</h3>
                                <p>开始分析您的第一个通话录音吧</p>
                                <a href="/" class="btn btn-primary" style="margin-top: 16px;">
                                    <span>📁</span> 去上传文件
                                </a>
                            </div>

                            <div class="pagination" id="pagination">
                                <span class="pagination-info" id="paginationInfo">共 0 条记录</span>
                                <div class="pagination-btns" id="paginationBtns">
                                </div>
                            </div>
                        </div>
                    </section>

                    <div class="error-message" id="errorMessage" style="display: none;">
                        <div class="error-content">
                            <span class="error-icon">⚠️</span>
                            <span class="error-text" id="errorText"></span>
                        </div>
                        <button class="btn btn-small" onclick="hideError()">确定</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Delete Modal -->
    <div class="modal-overlay" id="deleteModal">
        <div class="modal">
            <div class="modal-header">
                <span class="modal-icon">⚠️</span>
                <span class="modal-title">确认删除</span>
            </div>
            <div class="modal-body" id="deleteModalBody">
                确定要删除这条记录吗？此操作不可恢复。
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" onclick="closeDeleteModal()">取消</button>
                <button class="btn btn-danger" id="confirmDeleteBtn">确认删除</button>
            </div>
        </div>
    </div>

    <!-- Compare Modal -->
    <div class="modal-overlay compare-modal" id="compareModal">
        <div class="modal">
            <div class="modal-header">
                <span class="modal-icon">⚖️</span>
                <span class="modal-title">记录对比</span>
            </div>
            <div class="modal-body">
                <div class="compare-grid" id="compareGrid">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" onclick="closeCompareModal()">关闭</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/history.js') }}"></script>
</body>
</html>
